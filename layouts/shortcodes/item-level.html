<!-- item-level.html: the item level calculator of the forging page. The rules live in /js/item-level-core.js, the numbers in data/item_stats.yaml. -->
{{- $d := site.Data.item_stats -}}
<script type="application/json" id="il-data">{{ $d | jsonify | safeJS }}</script>

<div id="il-calculator" class="il mb-5">
  <section class="card shadow-sm mb-3">
    <div class="card-body">
      <h5 class="card-title">The item</h5>
      <div class="il-fields">
        <div><label class="form-label small" for="il-base">Base level</label><input class="form-control form-control-sm" id="il-base" type="number" min="1" value="20"></div>
        <div><label class="form-label small" for="il-sockets">Sockets</label><input class="form-control form-control-sm" id="il-sockets" type="number" min="0" max="4" value="0"></div>
      </div>
      <p class="il-hint mt-3 mb-1">Stats, fixed and rolled. A negative value is a drawback.</p>
      <div id="il-stats" class="il-rows"></div>
      <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="il-add">Add a stat</button>
      <template id="il-stat-row">
        <div class="il-row">
          <select class="form-select form-select-sm" data-stat aria-label="Stat">{{ range $d.stats }}<option value="{{ .id }}">{{ .label }}</option>{{ end }}</select>
          <input class="form-control form-control-sm" data-value type="number" aria-label="Value">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-remove aria-label="Remove">✕</button>
        </div>
      </template>
      <div class="il-result">
        <div class="il-result-label">Result</div>
        <table class="table table-sm table-borderless mb-0">
          <tr><th>Points</th><td id="il-points"></td></tr>
          <tr><th>Item level</th><td id="il-level"></td></tr>
          <tr><th>Category</th><td id="il-category"></td></tr>
          <tr><th>Top single STR roll at this level</th><td id="il-top"></td></tr>
        </table>
      </div>
    </div>
  </section>

  <section class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title">The forge</h5>
      <div class="il-fields">
        <div><label class="form-label small" for="il-rank">Forge Weapon / Armor level</label><input class="form-control form-control-sm" id="il-rank" type="number" min="0" max="10" value="5"></div>
        <div><label class="form-label small" for="il-material">Main material level</label><input class="form-control form-control-sm" id="il-material" type="number" min="1" value="20"></div>
      </div>
      <div class="il-result">
        <div class="il-result-label">Cap for random stats and sockets</div>
        <div id="il-cap"></div>
      </div>
    </div>
  </section>
</div>

<script src="{{ "js/item-level-core.js" | relURL }}" defer></script>
<script src="{{ "js/item-level-ui.js" | relURL }}" defer></script>

<style>
  /* Bootstrap's card and label colours ignore the theme's dark mode, so they take the page text colour. */
  .il .card, .il .form-label, .il .table { color: inherit; --bs-table-color: inherit; }
  .il .card { background-color: transparent; }
  .il td, .il th { font-variant-numeric: tabular-nums; }
  .il .il-hint { font-size: 0.875rem; opacity: 0.7; }
  .il .il-fields { display: grid; gap: 0.75rem 1rem; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); align-items: end; }
  .il .il-rows { display: flex; flex-direction: column; gap: 0.375rem; }
  .il .il-row { display: grid; grid-template-columns: minmax(0, 1fr) 6rem auto; gap: 0.5rem; }
  .il .il-result { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; border-left: 4px solid var(--bs-info); background-color: rgba(127, 127, 127, 0.08); }
  .il .il-result-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; margin-bottom: 0.5rem; }
  .il .il-result .table { --bs-table-bg: transparent; }
</style>
