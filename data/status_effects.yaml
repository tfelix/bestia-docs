# Every status effect a player can see, as zone-server's status_effects.yml defines it. The Status Effects page
# renders this file with the statuslist shortcode.
#
# `id` and `identifier` match zone-server. Internal bookkeeping effects (cooldown markers, INVULNERABLE) are left out.
# `resist` names the two attributes that shake the effect off; an empty list means it always lands.
# `dispellable: false` means no dispel or cure can remove it.
#
# Ids 31 and up follow the order of the skill rework game PRs (03 to 06). Check them against status_effects.yml
# once those PRs land.

- id: 1
  identifier: SWIFTNESS
  name: Swiftness
  polarity: BUFF
  resist: []
  effect: Move speed +10% per level.
  dispellable: true

- id: 2
  identifier: CRIPPLE
  name: Cripple
  polarity: DEBUFF
  resist: []
