# Every bestia species of the game, the source of the Bestia List page and of zone-server's mob YAMLs.
# tools/bestia_export.py runs the Bestia Blueprint Calculator on each row and writes the mob YAML.
#
# tier, role, element, kind and size are the calculator's inputs, see data/bestia_blueprint.yaml. element
# is the base element; the level follows from level and tier. loot chances are in percent.
# learnset changes the learnset the role builds: replace puts a utility skill in a slot (1 to 20), drop
# removes a slot and add learns one more skill at a level. look is the placeholder body on the client.
# handTuned keeps the stats of an existing mob YAML and only writes its learnset.

