# The item stats of the forging page and its calculator. Mirrors the server's ItemStat (points per unit),
# StatPool and ItemLevel; change both together.
levelsPerPoint: 3
pointsPerSocket: 5
# Forge Weapon / Forge Armor: reliable item level per skill level, and the rank at which the smith sets no limit.
reliableLevelPerRank: 10
uncappedAtRank: 10
materialHeadroom: 20
categories:
  - { label: Mundane, upTo: 20 }
  - { label: Superior, upTo: 50 }
  - { label: Rare, upTo: 80 }
  - { label: Legendary, upTo: 100 }
  - { label: Epic, upTo: null }
stats:
  - { id: STR, label: STR, unitsPerPoint: 1, pool: ATTRIBUTE }
  - { id: AGI, label: AGI, unitsPerPoint: 1, pool: ATTRIBUTE }
  - { id: VIT, label: VIT, unitsPerPoint: 1, pool: ATTRIBUTE }
  - { id: INT, label: INT, unitsPerPoint: 1, pool: ATTRIBUTE }
  - { id: DEX, label: DEX, unitsPerPoint: 1, pool: ATTRIBUTE }
  - { id: WIL, label: WIL, unitsPerPoint: 1, pool: ATTRIBUTE }
  - { id: ATK, label: ATK, unitsPerPoint: 2, pool: OFFENSE }
  - { id: MATK, label: MATK, unitsPerPoint: 2, pool: OFFENSE }
  - { id: HIT, label: HIT, unitsPerPoint: 1, pool: OFFENSE }
