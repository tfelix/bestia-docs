  - { id: DEF, label: "DEF %", unitsPerPoint: 1, pool: DEFENSE }
  - { id: MDEF, label: "MDEF %", unitsPerPoint: 1, pool: DEFENSE }
  - { id: FLEE, label: FLEE, unitsPerPoint: 1, pool: DEFENSE }
  - { id: MAX_HP, label: "Max HP %", unitsPerPoint: 1, pool: DEFENSE }
