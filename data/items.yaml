# Every item on the Items List page. The page renders from this file, and the Bestia Blueprint
# Calculator loads it as JSON to pick loot from.
#
# id is the item's name in zone-server's items.yml where the item exists there.
# value is a reference price in coins, for pricing loot. Bread is 9 and a gold ore 10,000
# (money-supply.md); everything else is a first guess placed between those anchors.
- id: mobile_laboratory
  name: Mobile Laboratory
  weight: 15
  type: Usable
  value: 2500
  description: |
    Alchemists use those small and laboratories to work on new recipies or brew potions and elexiers in the wild. When it is packed up it fits into a big crate and is quite transportable. A must have equipment for every alchemist.
    Use it to construct it in the world.
- id: apple
  name: Apple
  icon: apple.png
  weight: 0.1
  type: Usable
  value: 2
  description: |
    A fresh and jucy red apple. Looks like it came right from a tree.

    Restores 20 HP
- id: grape
  name: Grape
  weight: 0.1
  type: Usable
  value: 1
  description: |
    A sweet, ripe purple grape. It is said that its sugar vitalizes the brain.

    Restores 10 Mana
- id: iron_ore
  name: Iron Ore
  weight: 1
  type: Etc
  value: 20
  description: |
    Heavy, rugged chunks of iron ore. Blacksmiths prize these for their strength and potential. Can be used for forging.
- id: clay
  name: Clay
  weight: 1
  type: Etc
  value: 2
  description: |
    Smooth, earthy clay. Malleable and perfect for shaping into bricks, pottery, or magical seals. Can be used for forging.
- id: coal
  name: Coal
  weight: 0.4
  type: Etc
  value: 4
  description: |
    Glossy black lumps hewn out of a mineral seam. The reference fuel of every [Furnace](/docs/mechanics/item-list/#furnace) and what any serious smelting run burns — see [Refining](/docs/mechanics/natural-resources/#refining).
- id: charcoal
  name: Charcoal
  weight: 0.2
  type: Etc
  value: 3
  description: |
    Charred, brittle pieces of wood. Cheap furnace fuel and a base for potent alchemical mixtures. Burns cooler than [Coal](/docs/mechanics/item-list/#coal) and costs `-10%` on every [ore refinement](/docs/mechanics/items/#ore-refinement-success-chance) attempt.
- id: furnace
  name: Furnace
  weight: 40
  type: Etc
  value: 600
  description: |
    Blacksmiths use furnaces to smelt raw ore down into metal bars. Every batch burns [Coal](/docs/mechanics/item-list/#coal) or [Charcoal](/docs/mechanics/item-list/#charcoal), and both the ore and the fuel are lost if the smelt fails.
    Placing one requires [Ore Refinement](/docs/mechanics/master/#skill-ore-refinement) Lv. 1. Use it to construct it in the world.
- id: workbench_kit
  name: Workbench
  weight: "?"
  type: Etc
  value: 300
  description: |
    _(placeholder)_ A basic crafting station used by Carpentry to build items. Use it to construct it in the world.
- id: small_health_potion
  name: Small Health Potion
  weight: 0.2
  type: Usable
  value: 25
  description: |
    A tiny vial filled with shimmering red liquid. Instantly mends minor wounds and brings a gentle warmth to the soul. Heals 45 HP.
- id: health_potion
  name: Health Potion
  weight: 0.3
  type: Usable
  value: 80
  description: |
    A robust flask of vibrant crimson elixir. Favored by adventurers for its powerful restorative magic. Heals 170 HP.
- id: small_mana_potion
  name: Small Mana Potion
  weight: 0.2
  type: Usable
  value: 30
  description: |
    A delicate bottle of sparkling blue essence. Recharges a mage’s spirit and restores a touch of magical energy. Restores 45 Mana.
- id: mana_potion
  name: Mana Potion
  weight: 0.3
  type: Usable
  value: 100
  description: |
    A swirling flask of deep azure liquid. Pulses with arcane power, ready to fuel the most demanding spells. Restores 170 Mana.
- id: log
  name: Wood
  weight: 30
  type: Etc
  value: 6
  description: |
    This is raw wood and it can be further processed into building material which is required for most buildings.
- id: copper_ore
  name: Copper Ore
  weight: 1
