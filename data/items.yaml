- id: mana_essence
  name: Mana Essence
  weight: 0.3
  type: Etc
  value: 150
  description: |
    Raw mana-bearing powder. Fed into a Mana Harvester to grow mana crystals.
- id: pure_mana_essence
  name: Pure Mana Essence
  weight: 0.3
  type: Etc
  value: 600
  description: |
    A purer grade of mana powder that yields higher-quality mana crystals.
- id: mana_concentrate
  name: Mana Concentrate
  weight: 0.3
  type: Etc
  value: 1500
  description: |
