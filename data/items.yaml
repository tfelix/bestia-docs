- id: mana_dust
  name: Mana Dust
  weight: 0.2
  type: Etc
  value: 20
  description: |
    Fine, faintly glowing dust of condensed mana. Used to empower Bestia traps and ritual crafting.
- id: rough_gem
  name: Rough Gemstone
  weight: 0.3
  type: Etc
  value: 400
  description: |
    An uncut gem pried from a mineral vein. A Gem Cutter can facet it into a Cut Gemstone.
- id: cut_gemstone
  name: Cut Gemstone
  weight: 0.2
  type: Etc
  value: 1500
  description: |
    A faceted, polished gem. Slots into socketed equipment and fetches a high price at market.
- id: medicinal_herb
  name: Medicinal Herb
  weight: 0.1
  type: Etc
  value: 5
  description: |
    A common healing herb. A staple ingredient for potions and tonics.
- id: mana_herb
  name: Mana Herb
  weight: 0.1
  type: Etc
  value: 8
  description: |
    A faintly luminescent, mana-touched herb. Used in more potent alchemical brews.
- id: embercoal
  name: Embercoal
  weight: 0.5
  type: Etc
  value: 40
  description: |
    A lump of coal that never stops smouldering. Loaded into a blueprint to give a craft the fire element.
- id: frost_shard
  name: Frost Shard
  weight: 0.4
  type: Etc
  value: 40
  description: |
    A sliver of ice that never melts. Loaded into a blueprint to give a craft the frost element.
- id: empty_bottle
  name: Empty Bottle
  weight: 0.2
  type: Etc
  value: 3
  description: |
    A plain, corked glass bottle. The vessel behind every potion, tonic and blessed draught - alchemists and priests alike never carry enough of them.
- id: holy_water
  name: Holy Water
  weight: 0.3
  type: Etc
  value: 60
  description: |
    Plain water blessed in the rite of Aqua Benedicta. The reagent behind Aspersio and several higher rites.
- id: engraving_set
  name: Engraving Set
  weight: 3
  type: Etc
  value: 250
  description: |
    A roll of fine chisels, needles and etching stylae. Consumed when reworking an item to cut rune slots into it.
- id: mana_circle
  name: Mana Circle
  weight: 8
  type: Usable
  value: 1500
  description: |
    A coil of mana concentrate poured into a ring on the ground. Everyone standing inside lends their presence to a rite
    performed there, raising its success chance and splitting its mana cost. Consumed when the rite resolves. See
    [Mana Circles](/docs/mechanics/master/#mana-circles).
- id: gem_cut_station
  name: Gem Cut Station
  weight: 35
  type: Etc
  value: 2000
  description: |
    A bench of clamps, loupes and graded grit where a Miner turns rough gemstones into cut ones. Placing one requires
    [Gem Cutting](/docs/mechanics/master/#skill-gem-cutting) Lv. 1.
- id: breeder
  name: Breeder
  weight: 60
  type: Etc
  value: 3000
  description: |
    A warded pen where a pair of Bestia can be left together to produce an egg. Holds exactly one male and one female at a time.
    Use it to construct it in the world.
- id: bestia_trap
  name: Bestia Trap
  weight: 1.5
  type: Usable
  value: 50
  description: |
    The entry-level Magic Bestia Trap, woven from mana dust and cheap wards. Reliable against young Bestia and hopeless against anything grown.
    Base catch chance `+60%` against Bestia up to Lv. 20.
- id: super_trap
  name: Super Trap
  weight: 1.5
  type: Usable
  value: 200
  description: |
    A reinforced Magic Bestia Trap with a second layer of binding wards. The workhorse of most Foresters.
    Base catch chance `+100%` against Bestia up to Lv. 20.
- id: mega_trap
  name: Mega Trap
  weight: 2
  type: Usable
  value: 800
  description: |
    A Magic Bestia Trap built around a caged mana crystal. Expensive enough that most masters save them for something worth keeping.
    Base catch chance `+140%` against Bestia up to Lv. 20.
- id: master_trap
  name: Master Trap
  weight: 2
  type: Usable
  value: 3000
  description: |
    The finest Magic Bestia Trap a Craftsman can produce. The only trap with any real hope against a Bestia past Lv. 100.
    Base catch chance `+180%` against Bestia up to Lv. 20.
- id: jelly
  name: Jelly
  weight: 0.1
  type: Etc
  value: 2
  description: |
    A wobbly lump of jelly left behind by a blob. Cooks use it to thicken stews.
- id: raw_meat
  name: Raw Meat
  weight: 0.5
  type: Etc
  value: 4
  description: |
    A cut of fresh meat. It spoils within days unless it is salted or cooked.
- id: raw_hide
  name: Raw Hide
  weight: 1
  type: Etc
  value: 6
  description: |
    The untreated hide of an animal. A tanner turns it into leather.
- id: wool
  name: Wool
  weight: 0.3
  type: Etc
  value: 5
  description: |
    A tuft of soft wool. Weavers spin it into yarn for cloth.
